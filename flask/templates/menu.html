{% extends 'layout.html' %}

{% block content %}
<div class="split-layout">
    <div class="main-content-split">
        
        <div class="tabs">
            <button class="tab active" onclick="filterMenu('Todos')">Todos</button>
            <button class="tab" onclick="filterMenu('BEBIDAS')">Bebidas</button>
            <button class="tab" onclick="filterMenu('ALIMENTOS')">Comida</button>
            <button class="tab" onclick="filterMenu('POSTRES')">Postres</button>
        </div>

        <div class="menu-list">
            {% for p in menu %}
            <div class="menu-item" data-category="{{ p.categoria.nombre if p.categoria else 'General' }}">
                <div class="menu-item-img" style="background-image: linear-gradient(135deg, #e3d3c4, #eeddce);"></div>
                <div class="menu-item-info">
                    <div class="menu-item-title">{{ p.nombre }}</div>
                    <div class="menu-item-desc">{{ p.categoria.nombre if p.categoria else 'General' }} &bull; {{ p.descripcion or 'Sin descripción' }}</div>
                    <div class="menu-item-price">${{ "%.2f"|format(p.precio) }}</div>
                </div>
                <form method="POST" action="{{ url_for('menu') }}" style="display:inline;">
                    <input type="hidden" name="action" value="delete">
                    <input type="hidden" name="id" value="{{ p.id }}">
                    <button type="submit" style="background:none; border:none; cursor:pointer;" onclick="return confirm('¿Eliminar producto?');">
                        <span class="action-icon" style="mask-image: url('data:image/svg+xml;utf8,<svg viewBox=\"0 0 24 24\" fill=\"currentColor\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z\"/></svg>'); width: 24px; height: 24px; display: inline-block; background-color: var(--text-muted);"></span>
                    </button>
                </form>
            </div>
            {% endfor %}
        </div>
    </div>
    
    <div class="right-panel open" style="width: 500px;">
        <form method="POST" action="{{ url_for('menu') }}">
            <input type="hidden" name="action" value="create">
            <div class="panel-header" style="background-color: var(--main-bg); border-bottom: none; padding-bottom: 0;">
                <div style="flex-grow: 1; display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h3 class="panel-title">Nuevo Platillo</h3>
                    </div>
                    <div style="display: flex; gap: 1rem;">
                        <button type="button" class="btn btn-outline panel-close" style="padding: 0.5rem 1rem;">Cancelar</button>
                        <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1rem;">Guardar Producto</button>
                    </div>
                </div>
            </div>
            <div class="panel-body" style="background-color: var(--main-bg);">
                
                <div class="card" style="display: flex; gap: 1.5rem; margin-bottom: 1.5rem;">
                    <div class="image-upload-placeholder" style="width: 200px; height: 200px; margin: 0; flex-shrink: 0;">
                        <span class="icon-upload"></span>
                        <span style="font-size: 0.75rem; margin-top: 0.5rem; text-align: center; padding: 0 1rem;">Arrastra o haz clic para subir imagen</span>
                    </div>
                    <div style="flex-grow: 1;">
                        <div class="form-group">
                            <label class="form-label">NOMBRE DEL PLATILLO</label>
                            <input type="text" name="nombre" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">DESCRIPCIÓN</label>
                            <input type="text" name="descripcion" class="form-control">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">CATEGORÍA</label>
                                <select name="categoria_id" class="form-control" required>
                                    {% for c in categorias %}
                                    <option value="{{ c.id }}">{{ c.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">PRECIO DE VENTA</label>
                                <div style="position: relative;">
                                    <span style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%);">$</span>
                                    <input type="number" step="0.01" name="precio" class="form-control" style="padding-left: 1.5rem;" required>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


            </div>
        </form>
    </div>
</div>

<script>
function filterMenu(category) {
    document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');

    document.querySelectorAll('.menu-item').forEach(item => {
        if (category === 'Todos' || item.getAttribute('data-category') === category) {
            item.style.display = 'flex';
        } else {
            item.style.display = 'none';
        }
    });
}
</script>
{% endblock %}
