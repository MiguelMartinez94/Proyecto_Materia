version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cafeteria_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: cafeteria
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./fastapi_backend
    container_name: cafeteria_backend
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:admin123@db:5432/cafeteria
    ports:
      - "8000:8000"

  flask:
    build:
      context: ./flask_app
    container_name: cafeteria_flask
    depends_on:
      - backend
    environment:
      - FASTAPI_URL=http://backend:8000
    ports:
      - "5000:5000"

  mobile:
    build:
      context: ./mobile_app
    container_name: cafeteria_mobile
    ports:
      - "8081:8081"
    environment:
      # Dependiendo de tu red local, puede que necesites definir REACT_NATIVE_PACKAGER_HOSTNAME
      - EXPO_WEB_PORT=8081

volumes:
  postgres_data:
